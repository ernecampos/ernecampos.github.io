career-profile:
  title: Welcome to my research page!
  summary: |
    I am Ernesto Campos, a researcher and adjunct professor of computer science at the Monterrey Institute of Technology (ITESM).
    
    I study the intersection of quantum and classical machine learning, with research subjects including variational quantum algorithms,
    quantum approximate optimization, analog-digital algorithms, quantum walks, and tensor networks.
    
    Much of my work on variational quantum algorithms has focused on a simple question: when, and why, does training succeed? 
    In 2021, we identified several mechanisms that explain failure modes in shallow circuits. 
    We showed that cost landscapes can undergo abrupt training transitions,<a href="https://journals.aps.org/pra/abstract/10.1103/PhysRevA.103.032607" target="_blank"><sup>1 </sup> </a>
    where shallow models 
    become trapped in trivial minima and require substantially greater depth to reach meaningful solutions.
    We also introduced the notion of training saturation,<a href="https://journals.aps.org/pra/abstract/10.1103/PhysRevA.104.L030401" target="_blank"><sup>2 </sup> </a> 
    demonstrating that layerwise-optimized circuits 
    hit a structural ceiling beyond which performance cannot improve. In parallel, we proved parameter 
    concentration effects,<a href="https://journals.aps.org/pra/abstract/10.1103/PhysRevA.104.L010401" target="_blank"><sup>3 </sup> </a> showing that optimal parameters cluster across problem instances. 
    
    These results helped shift attention away from barren plateaus as the only obstacle, toward a broader landscape of 
    structural training limits. In response, we proposed hardware-native, problem-tailored ansatz 
    constructions.<a href="https://journals.aps.org/pra/abstract/10.1103/PhysRevA.106.032418" target="_blank"><sup>4 </sup> </a>
    These models not only improved performance on combinatorial optimization problems, but 
    also exhibited markedly better training behavior than generic circuit templates. More recently, we 
    proved that QAOA achieves the same depth scaling as Grover search for unstructured problems,<a href="https://journals.aps.org/pra/abstract/10.1103/PhysRevA.110.012428" target="_blank"><sup>5 </sup> </a>
    formally 
    establishing a quantum speedup in that setting.
    
    Together, this line of work has helped shape modern strategies such as warm-start initialization and 
    dynamically constructed ansatz circuits. The central challenge now is sharper: to identify trainable 
    quantum models that cannot be efficiently dequantized, and that deliver a provable advantage on meaningful problems.

collaboration:
  title: Do you want to work with me?
  summary: |
    Contact me to attend our weekly meetings! We are currently working on cost landscape engineering to improve variational algorithm trainability, 
    and ensemble quantum algorithms that combine multiple models to solve complex problems within the scale 
    constraints of near-term devices.
    
teaching:
  title: Teaching
  summary: |
    I enjoy teaching students from all kinds of backgrounds—whether in physics, computer science, or beyond.
    My goal is to make challenging topics in quantum computing and computer science feel approachable and exciting by connecting 
    theory with hands-on practice. 

    My courses at ITESM:
    
  courses:

    - title: "Software Architecture and Design"
      period: "Spring 2026"
      
    - title: "Introduction to Quantum Computing"
      period: "Fall 2025"
    

    


    
